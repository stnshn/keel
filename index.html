<!DOCTYPE html>
<html lang="de">
<head>

  <!-- Damit die App vom Home-Bildschirm ohne Safari-Leisten startet -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keel">
  <meta name="theme-color" content="#0B0F14">

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">
    <div id="schirm"><!-- wird von app.js gefuellt --></div>

  <nav class="nav">

      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>

    <button data-schirm="einaus">
      <svg viewBox="0 0 24 24"><path d="M7 20V9"/><path d="M4 12l3-3 3 3"/><path d="M17 4v11"/><path d="M14 12l3 3 3-3"/></svg>

      Vermögen

    <button data-schirm="mehr">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      Mehr
    </button>
  </nav>

  <script src="csv.js"></script>
  <script src="phase2.js"></script>
  <script src="start.js"></script>
